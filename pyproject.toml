[project]
name = "dnd-copilot"
version = "0.1.0"
description = "Tabletop Copilot — советник по D&D 5e: детерминированные правила + LLM только для объяснений"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
llm = [
    "instructor>=1.3.0",
    "google-generativeai>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters", "apps", "tools"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
